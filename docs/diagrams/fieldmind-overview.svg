<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1320" viewBox="0 0 1600 1320"><title>FieldMind 通用机器人技能编排架构</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#60804b"/></marker></defs><rect width="1600" height="1320" fill="#f5f7f2"/><style>text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#203126}.l{font-size:17px;letter-spacing:2px;fill:#647461}.b{font-size:21px;fill:#52634f}.t{font-size:27px;font-weight:700}.s{font-size:18px;fill:#52634f}</style><text x="48" y="76" class="l" >FIELDMIND / PHYSICAL AGENT</text><text x="48" y="123" class="t" style="font-size:39px">以目标组织技能，以反馈推动任务完成</text><text x="1530" y="76" class="s" text-anchor="end">整体设计 · 技能类别可扩展</text><text x="1530" y="113" class="s" text-anchor="end">本地优先 / 跨设备 / 可迁移</text><rect x="48" y="166" width="1504" height="90" rx="16" fill="#e8efdf" stroke="#d5dfce"/><text x="76" y="199" class="l" >01  任务入口</text><text x="76" y="234" class="b" >自然语言 / 业务事件 / 操作界面</text><text x="700" y="219" class="b" >递送物品 · 工位协作 · 访客接待 · 设备服务 · 巡检</text><path d="M597 256V291" fill="none" stroke="#60804b" stroke-width="3"  marker-end="url(#a)"/><rect x="48" y="292" width="1098" height="190" rx="16" fill="#fff" stroke="#d5dfce"/><text x="76" y="328" class="l" >02  AGENT 决策层</text><rect x="76" y="350" width="287" height="106" rx="16" fill="#f1f6e9" stroke="#d5dfce"/><text x="96" y="386" class="t" >目标与上下文</text><text x="96" y="421" class="b" >澄清需求 · 环境 · 约束</text><rect x="389" y="350" width="327" height="106" rx="16" fill="#f1f6e9" stroke="#d5dfce"/><text x="409" y="386" class="t" >技能发现与任务规划</text><text x="409" y="421" class="b" >可用能力 → 依赖与完成条件</text><rect x="742" y="350" width="376" height="106" rx="16" fill="#f1f6e9" stroke="#d5dfce"/><text x="762" y="386" class="t" >本地模型服务</text><text x="762" y="421" class="b" >语言 / 视觉 / 语音模型接口</text><path d="M364 402H386" fill="none" stroke="#60804b" stroke-width="3"  marker-end="url(#a)"/><path d="M739 402H718" fill="none" stroke="#60804b" stroke-width="3"  marker-end="url(#a)"/><path d="M597 482V521" fill="none" stroke="#60804b" stroke-width="3"  marker-end="url(#a)"/><rect x="48" y="522" width="1098" height="139" rx="16" fill="#fff" stroke="#d5dfce"/><text x="76" y="555" class="l" >03  任务图与执行运行时</text><text x="76" y="594" class="t" >任务依赖 · 并行与条件路径 · 资源协调 · 状态持久化</text><text x="76" y="632" class="b" >执行前检查契约；根据步骤结果推进任务；反馈驱动有界重规划。</text><path d="M597 661V700" fill="none" stroke="#60804b" stroke-width="3"  marker-end="url(#a)"/><rect x="48" y="701" width="1098" height="168" rx="16" fill="#fff" stroke="#d5dfce"/><text x="76" y="735" class="l" >04  开放 SKILL 目录</text><rect x="76" y="754" width="162" height="68" rx="16" fill="#edf4e5" stroke="#d5dfce"/><text x="157" y="783" class="b" text-anchor="middle" style="font-weight:700">导航</text><text x="157" y="809" class="s" text-anchor="middle">到达 / 跟随</text><rect x="250" y="754" width="162" height="68" rx="16" fill="#edf4e5" stroke="#d5dfce"/><text x="331" y="783" class="b" text-anchor="middle" style="font-weight:700">感知</text><text x="331" y="809" class="s" text-anchor="middle">识别 / 定位</text><rect x="424" y="754" width="162" height="68" rx="16" fill="#edf4e5" stroke="#d5dfce"/><text x="505" y="783" class="b" text-anchor="middle" style="font-weight:700">操作</text><text x="505" y="809" class="s" text-anchor="middle">抓取 / 工具</text><rect x="598" y="754" width="162" height="68" rx="16" fill="#edf4e5" stroke="#d5dfce"/><text x="679" y="783" class="b" text-anchor="middle" style="font-weight:700">交互</text><text x="679" y="809" class="s" text-anchor="middle">对话 / 交接</text><rect x="772" y="754" width="162" height="68" rx="16" fill="#edf4e5" stroke="#d5dfce"/><text x="853" y="783" class="b" text-anchor="middle" style="font-weight:700">设备与业务</text><text x="853" y="809" class="s" text-anchor="middle">查询 / 联动</text><rect x="946" y="754" width="162" height="68" rx="16" fill="#edf4e5" stroke="#d5dfce"/><text x="1027" y="783" class="b" text-anchor="middle" style="font-weight:700">更多技能</text><text x="1027" y="809" class="s" text-anchor="middle">按契约接入</text><text x="76" y="850" class="s" >统一契约：输入 / 输出 / 前置条件 / 资源 / 执行状态 / 完成依据</text><path d="M597 869V908" fill="none" stroke="#60804b" stroke-width="3"  marker-end="url(#a)"/><rect x="48" y="909" width="1098" height="158" rx="16" fill="#fff" stroke="#d5dfce"/><text x="76" y="943" class="l" >05  设备适配与物理执行</text><text x="76" y="985" class="t" >HTTP / ROS 2 / 厂商 SDK / 业务系统接口</text><text x="76" y="1023" class="b" >移动底盘 · 机械臂 · 复合机器人 · 传感器 · 现场设备</text><text x="76" y="1051" class="s" >适配器负责能力映射；底层控制器负责运动与设备控制。</text><rect x="1190" y="292" width="362" height="775" rx="16" fill="#eaf1f4" stroke="#cfdee5"/><text x="1218" y="333" class="t" >观测与反馈闭环</text><rect x="1218" y="375" width="306" height="140" rx="16" fill="#fff" stroke="#cfdee5"/><text x="1240" y="415" class="b" style="font-weight:700">现场观测与上下文</text><text x="1240" y="455" class="b" >图像 / 语音 / 位姿 / 状态</text><text x="1240" y="489" class="s" >提供下一步决策依据</text><rect x="1218" y="555" width="306" height="150" rx="16" fill="#fff" stroke="#cfdee5"/><text x="1240" y="595" class="b" style="font-weight:700">证据与任务记忆</text><text x="1240" y="635" class="b" >执行记录 / 资产 / 历史</text><text x="1240" y="669" class="s" >关联任务、技能与结果</text><rect x="1218" y="748" width="306" height="161" rx="16" fill="#fff" stroke="#cfdee5"/><text x="1240" y="788" class="b" style="font-weight:700">Verifier 完成验证</text><text x="1240" y="828" class="b" >检查任务条件与实际结果</text><text x="1240" y="862" class="s" >完成 / 继续 / 调整计划</text><path d="M1371 515V551" fill="none" stroke="#60804b" stroke-width="3"  marker-end="url(#a)"/><path d="M1371 705V744" fill="none" stroke="#60804b" stroke-width="3"  marker-end="url(#a)"/><path d="M1146 989H1168V445H1214" fill="none" stroke="#60804b" stroke-width="3"  marker-end="url(#a)"/><text x="1230" y="975" class="s" >执行反馈</text><path d="M1190 400H1149" fill="none" stroke="#60804b" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#a)"/><text x="1218" y="1030" class="s" >反馈更新状态与后续计划</text><rect x="48" y="1110" width="1504" height="152" rx="16" fill="#203126" stroke="#203126"/><text x="76" y="1150" class="l" style="fill:#b7e36f">LOCAL-FIRST · 可迁移部署</text><text x="76" y="1193" class="t" style="fill:#fff">DGX Spark / GPU 工作站 / 其他现场计算节点</text><text x="76" y="1230" class="b" style="fill:#d4dfcd">模型、编排与数据可部署于本机或现场网络；机器人通过适配器连接。</text><text x="1530" y="1295" class="s" text-anchor="end">设计总览｜具体技能由设备与适配器提供；各模块实现见 README 工程映射。</text><path d="M1524 828H1540V445H1527" fill="none" stroke="#60804b" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#a)"/></svg>
